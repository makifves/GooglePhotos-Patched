name: Build, Patch and Release Google Photos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Mevcut sürüm olsa bile zorla derle ve yayınla (Force Rebuild)'
        required: false
        type: boolean
        default: false
      direct_apk_url:
        description: 'Direct APK Download URL (APKMirror çalışmazsa alternatif doğrudan link)'
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-and-patch:
    name: Build Patch & Release Google Photos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: write
    steps:
      - name: Checkout Release Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Check Latest APKMirror Version
        id: check_upstream
        run: |
          python .github/scripts/download_apk.py --check-version

      - name: Check Existing Release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          RAW_VER="${{ steps.check_upstream.outputs.apk_version }}"
          APK_VER=$(echo "$RAW_VER" | sed -e 's/[^0-9.]//g' -e 's/\.*$//')
          echo "Latest upstream version found: $APK_VER"

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "Force rebuild aktif. Release kontrolü atlanıyor."
          elif [ -n "$APK_VER" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="v${APK_VER}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Release $TAG zaten mevcut. İşlem atlanıyor."
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout Patches Repository (Morphe Google Photos)
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: 'Akash-Sriram/morphe-google-photos'
          path: 'morphe-google-photos'

      - name: Setup Java 21
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        if: steps.check_release.outputs.skip != 'true'
        uses: burrunan/gradle-cache-action@v3
        with:
          build-root-directory: morphe-google-photos

      - name: Overlay Custom Patches
        if: steps.check_release.outputs.skip != 'true'
        run: |
          if [ -d "custom-patches" ]; then
            echo "Copying custom-patches into morphe-google-photos..."
            cp -r custom-patches/* morphe-google-photos/
          fi

      - name: Build Morphe Patches
        if: steps.check_release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd morphe-google-photos
          chmod +x gradlew
          ./gradlew :extensions:shared:syncExtension :patches:buildAndroid generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Locate Patch Bundle
        if: steps.check_release.outputs.skip != 'true'
        id: locate_patch
        run: |
          PATCH_FILE=$(find morphe-google-photos/patches/build/libs \( -name "patches-*.mpp" -o -name "patches-*.jar" \) | grep -v "\-sources" | grep -v "\-javadoc" | sort -V | tail -n 1)
          if [ -z "$PATCH_FILE" ]; then
            echo "Error: Patch dosyası bulunamadı!"
            exit 1
          fi
          echo "PATCH_PATH=$PATCH_FILE" >> $GITHUB_ENV
          echo "Bulunan patch dosyası: $PATCH_FILE"

      - name: Setup Morphe CLI
        if: steps.check_release.outputs.skip != 'true'
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep "browser_download_url.*morphe-desktop.*all.jar" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          fi
          echo "Downloading Morphe Desktop CLI: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Download Google Photos APK
        if: steps.check_release.outputs.skip != 'true'
        id: download_apk
        run: |
          DIRECT_URL="${{ inputs.direct_apk_url }}"
          if [ -n "$DIRECT_URL" ]; then
            python .github/scripts/download_apk.py --direct-url "$DIRECT_URL" --output google-photos-base.apk
          else
            python .github/scripts/download_apk.py --retries 3 --output google-photos-base.apk
          fi

      - name: Strip APK to arm64-v8a and English Only
        if: steps.check_release.outputs.skip != 'true'
        run: |
          python3 - << 'EOF'
          import zipfile
          import os

          src = "google-photos-base.apk"
          dst = "google-photos-slim.apk"

          def should_keep(path):
              # Sadece arm64 native kütüphanelerini tut, armeabi-v7a ve x86'ları ele
              if path.startswith("lib/"):
                  return path.startswith("lib/arm64-v8a/")
              
              # Sadece varsayılan ve İngilizce kaynak klasörlerini tut
              if path.startswith("res/"):
                  folder = path.split('/')[1]
                  if '-' in folder:
                      qualifiers = folder.split('-')[1:]
                      for q in qualifiers:
                          # 2/3 harfli dil kodu (ör: tr, de, es, fr, ru) veya b+ kodu varsa
                          if (len(q) in (2, 3) or q.startswith('b+')) and not q.startswith('en'):
                              return False
              return True

          print("Gereksiz mimariler ve diller temizleniyor...")
          removed_count = 0
          kept_count = 0

          with zipfile.ZipFile(src, 'r') as zin, zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if should_keep(item.filename):
                      zout.writestr(item, zin.read(item.filename))
                      kept_count += 1
                  else:
                      removed_count += 1

          os.replace(dst, src)
          print(f"Tamamlandı: {removed_count} dosya elendi, {kept_count} dosya korundu.")
          EOF

      - name: Extract Actual APK Version
        if: steps.check_release.outputs.skip != 'true'
        id: get_apk_ver
        run: |
          AAPT_PATH=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          APK_VER=$($AAPT_PATH dump badging google-photos-base.apk | grep -oP "versionName='\K[^']+")
          echo "Actual APK version extracted: $APK_VER"
          echo "apk_version=$APK_VER" >> $GITHUB_OUTPUT

      - name: Patch Google Photos APKs
        if: steps.check_release.outputs.skip != 'true'
        run: |
          echo "🧩 [1/2] Mod Paketi Derleniyor (app.morphe.android.apps.photos)..."
          java -jar morphe-cli.jar patch \
            -f \
            -p "${{ env.PATCH_PATH }}" \
            -d "Custom Morphe branding" \
            -e "Flag manager & Toolkit" \
            -O components="both" \
            --unsigned \
            -o patched-mod-unsigned.apk \
            google-photos-base.apk

          echo "🧩 [2/2] Orijinal Paket Derleniyor (com.google.android.apps.photos)..."
          java -jar morphe-cli.jar patch \
            -f \
            -p "${{ env.PATCH_PATH }}" \
            -e "Official package name" \
            -d "Custom Morphe branding" \
            -e "Flag manager & Toolkit" \
            -O components="both" \
            --unsigned \
            -o patched-original-unsigned.apk \
            google-photos-base.apk

      - name: Download uber-apk-signer
        if: steps.check_release.outputs.skip != 'true'
        run: |
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign Patched APKs
        if: steps.check_release.outputs.skip != 'true'
        run: |
          APK_VER="${{ steps.get_apk_ver.outputs.apk_version }}"
          APK_VER=$(echo "$APK_VER" | sed -e 's/[^0-9.]//g' -e 's/\.*$//')
          if [ -z "$APK_VER" ]; then
            APK_VER="build-${{ github.run_number }}"
          fi

          OUT_MOD="GooglePhotos-v${APK_VER}-arm64-mod.apk"
          OUT_ORIGINAL="GooglePhotos-v${APK_VER}-arm64-original.apk"
          echo "RELEASE_APK_MOD=${OUT_MOD}" >> $GITHUB_ENV
          echo "RELEASE_APK_ORIGINAL=${OUT_ORIGINAL}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${APK_VER}" >> $GITHUB_ENV

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64 bulundu, özel anahtar ile imzalanıyor..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KEYSTORE_PARAMS="--ks release.keystore --ksPass android --keyPass android"
          else
            echo "UYARI: KEYSTORE_BASE64 bulunamadı. Dahili debug anahtarı kullanılıyor."
            KEYSTORE_PARAMS=""
          fi

          java -jar uber-apk-signer.jar \
            --apks patched-mod-unsigned.apk \
            $KEYSTORE_PARAMS \
            --overwrite

          mv patched-mod-unsigned.apk "${OUT_MOD}"

          java -jar uber-apk-signer.jar \
            --apks patched-original-unsigned.apk \
            $KEYSTORE_PARAMS \
            --overwrite

          mv patched-original-unsigned.apk "${OUT_ORIGINAL}"

          rm -f release.keystore

      - name: Upload Mod APK Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_MOD }}
          path: ${{ env.RELEASE_APK_MOD }}

      - name: Upload Original APK Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_ORIGINAL }}
          path: ${{ env.RELEASE_APK_ORIGINAL }}

      - name: Publish or Update Patched APK Release
        if: steps.check_release.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          TITLE="Google Photos v${{ env.RELEASE_VERSION }} (arm64-v8a)"
          APK_MOD="${{ env.RELEASE_APK_MOD }}"
          APK_ORIGINAL="${{ env.RELEASE_APK_ORIGINAL }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG mevcut. Dosyalar güncelleniyor..."
            gh release upload "$TAG" "$APK_MOD" "$APK_ORIGINAL" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            echo "Yeni release $TAG oluşturuluyor..."
            gh release create "$TAG" "$APK_MOD" "$APK_ORIGINAL" --title "$TITLE" --latest
          fi
